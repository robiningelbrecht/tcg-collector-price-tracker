<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex,nofollow">
        <meta name="theme-color" content="#1B1D1E">
        <title>Binders · TCG Price Tracker</title>
        <link href="favicon.svg" type="image/svg+xml" rel="icon">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style type="text/tailwindcss">
            @theme static {
              --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

              --color-dark-950: #121314;
              --color-dark-900: #1B1D1E;
              --color-dark-800: #232627;
              --color-dark-700: #2C3032;
              --color-dark-600: #363B3E;
              --color-dark-500: #545B5E;
              --color-dark-400: #7A8286;
              --color-dark-300: #A1A8AC;
              --color-dark-200: #C9CED0;
              --color-dark-100: #E8E6E3;

              --color-brand: #FA7035;
              --color-brand-hover: #F64E06;
              --color-brand-soft: #FA703522;

              --color-page: var(--color-dark-900);
              --color-panel: var(--color-dark-800);
              --color-chip: var(--color-dark-700);
              --color-line: var(--color-dark-600);
              --color-ink: var(--color-dark-100);
              --color-muted: var(--color-dark-300);
              --color-link: #3391FF;
              --color-up: #4CC25A;
              --color-down: #F0625E;
            }

            @layer components {
              .panel { @apply min-w-0 rounded-lg border border-line bg-panel p-4 shadow-sm; }
              .panel-title { @apply m-0 text-sm font-semibold; }
              .sub { @apply text-[13px] text-muted; }
              .up { @apply text-up; }
              .down { @apply text-down; }

              .seg { @apply inline-flex gap-0.5 rounded-md bg-chip p-[3px]; }
              .seg > * { @apply cursor-pointer rounded px-2.5 py-1.5 text-[13px] font-semibold text-muted transition-colors hover:text-ink; }
              .seg > .on { @apply opacity-100 bg-brand text-white shadow-sm hover:bg-brand-hover hover:text-white; }

              .kpi-l { @apply text-[11.5px] font-semibold uppercase tracking-wider text-muted; }
              .kpi-v { @apply mt-1 text-2xl font-bold tabular-nums; }
              .kpi-s { @apply mt-0.5 truncate text-[12.5px] text-muted; }

              .tag { @apply ml-1 inline-block rounded bg-brand-soft px-1.5 align-[1px] text-[10.5px] font-bold text-brand; }
              .tag-muted { @apply bg-chip text-muted; }
              .chip { @apply rounded-full bg-chip px-2.5 py-0.5 text-[12.5px] tabular-nums; }
              .empty { @apply py-2 text-[13px] text-muted; }

              .btn { @apply inline-flex cursor-pointer items-center rounded-md bg-brand px-3 py-1.5 text-[13px] font-semibold text-white shadow-sm transition-colors hover:bg-brand-hover disabled:cursor-wait disabled:opacity-60; }
              .btn-muted { @apply bg-chip text-ink hover:bg-dark-600; }
              .btn-danger { @apply bg-chip text-down hover:bg-down hover:text-white; }

              .field { @apply rounded-md border border-line bg-panel px-2.5 py-1.5 text-ink outline-none focus:border-brand focus:ring-2 focus:ring-brand-soft; }

              .modal { @apply fixed inset-0 z-50 hidden items-start justify-center overflow-auto bg-black/60 px-4 py-8; }
              .modal.open { @apply flex; }

              .bar { @apply h-1.5 overflow-hidden rounded-full bg-chip; }
              .bar > span { @apply block h-full rounded-full bg-brand; }
              .bar.done > span { @apply bg-up; }

              .binder { @apply min-w-0 rounded-lg border border-line bg-panel p-4 shadow-sm flex cursor-pointer flex-col gap-3 transition-colors hover:border-dark-500; }
              .binder-logo { @apply grid h-16 place-items-center rounded-md bg-dark-900 px-3; }
              .binder-logo img { @apply max-h-12 max-w-full object-contain; }

              .slot { @apply relative aspect-[4/5] overflow-hidden rounded-md border border-line bg-dark-900; }
              .slot.missing { @apply grid cursor-pointer place-items-center border-dashed border-dark-500 text-muted hover:border-brand hover:text-brand; }
              .slot img { @apply size-full cursor-zoom-in object-cover; }
              .slot .lbl { @apply absolute inset-x-0 bottom-0 flex items-center justify-between gap-2 bg-gradient-to-t from-black/80 to-transparent px-2.5 pb-2 pt-6 text-xs font-semibold text-white; }
              .slot .acts { @apply absolute right-1.5 top-1.5 flex gap-1 opacity-0 transition-opacity; }
              .slot:hover .acts, .slot:focus-within .acts { @apply opacity-100; }
              .slot .acts button { @apply grid size-7 cursor-pointer place-items-center rounded-md bg-black/70 text-white hover:bg-brand; }
            }
        </style>
    </head>
    <body class="bg-page font-sans text-sm leading-[1.45] text-ink antialiased">
        <header class="sticky top-0 z-40 bg-dark-900 shadow-[0_1px_0_var(--color-dark-700)]">
            <div class="mx-auto flex h-14 max-w-7xl items-center justify-between gap-4 px-4">
                <a href="#" data-home class="flex shrink-0 items-center gap-3">
                    <img src="https://static.tcgcollector.com/build/images/tcgcollector-logo-with-text-light.15508095.svg" alt="TCG Collector" referrerpolicy="no-referrer" class="h-6 w-auto sm:h-7">
                    <span class="hidden h-5 w-px bg-dark-600 sm:block"></span>
                    <span class="hidden text-[13px] font-semibold text-dark-300 sm:block">Binder vault</span>
                </a>
                <nav class="ml-auto flex items-center gap-1">
                    <a href="#" data-home class="rounded-md bg-dark-700 px-3 py-2 text-[13px] font-semibold text-dark-100" aria-current="page">Binders</a>
                    <button type="button" class="btn ml-2" data-open-add>+ Add binder</button>
                </nav>
            </div>
        </header>

        <main class="mx-auto max-w-7xl px-4 pb-16 pt-6">
            <section data-view="overview">
                <div class="mb-4 flex flex-wrap items-end justify-between gap-4">
                    <div>
                        <h1 class="m-0 text-2xl font-bold">Binders</h1>
                        <div class="sub" data-overview-sub></div>
                    </div>
                    <button type="button" class="btn btn-muted" data-export>Export all photos</button>
                </div>

                <div class="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4">
                    <div class="panel"><div class="kpi-l">Binders</div><div class="kpi-v" data-kpi="binders"></div><div class="kpi-s" data-kpi-s="binders"></div></div>
                    <div class="panel"><div class="kpi-l">Pages photographed</div><div class="kpi-v" data-kpi="pages"></div><div class="kpi-s" data-kpi-s="pages"></div></div>
                    <div class="panel"><div class="kpi-l">Coverage</div><div class="kpi-v" data-kpi="coverage"></div><div class="kpi-s"><div class="bar mt-2" data-kpi-bar><span></span></div></div></div>
                    <div class="panel"><div class="kpi-l">Oldest photo</div><div class="kpi-v" data-kpi="oldest"></div><div class="kpi-s" data-kpi-s="oldest"></div></div>
                </div>

                <div class="mb-4 hidden rounded-md border-l-4 border-brand bg-chip px-3 py-2 text-[12.5px] text-muted" data-overview-notice></div>

                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" data-binders></div>
            </section>

            <section data-view="binder" hidden>
                <a href="#" data-home class="mb-3 inline-block text-[13px] text-link hover:underline">← All binders</a>
                <div class="mb-4 flex flex-wrap items-end justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="binder-logo hidden h-14 w-36 sm:grid" data-binder-logo></div>
                        <div>
                            <h1 class="m-0 text-2xl font-bold" data-binder-title></h1>
                            <div class="sub" data-binder-sub></div>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <nav class="seg" data-filter>
                            <button type="button" data-filter-value="all" class="on">All</button>
                            <button type="button" data-filter-value="missing">Missing</button>
                            <button type="button" data-filter-value="stale">Outdated</button>
                        </nav>
                        <button type="button" class="btn btn-muted" data-add-page>+ Page</button>
                        <button type="button" class="btn btn-danger" data-delete-binder>Delete binder</button>
                    </div>
                </div>
                <div class="panel">
                    <div class="mb-3 flex items-center justify-between gap-2">
                        <h2 class="panel-title">Pages</h2>
                        <span class="sub" data-binder-count></span>
                    </div>
                    <div class="bar mb-4" data-binder-bar><span></span></div>
                    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6" data-pages></div>
                </div>
            </section>
        </main>

        <input type="file" accept="image/*" capture="environment" class="hidden" data-file>

        <div class="modal" data-modal="add">
            <form class="relative w-full max-w-md overflow-hidden rounded-xl border border-line bg-panel" data-add-form>
                <div class="flex items-center justify-between bg-dark-900 px-5 py-3">
                    <h2 class="panel-title">Add binder</h2>
                    <button type="button" aria-label="Close" class="grid size-8 cursor-pointer place-items-center rounded-md bg-dark-700 text-lg text-dark-100 hover:bg-brand hover:text-white" data-close>×</button>
                </div>
                <div class="flex flex-col gap-3 p-5">
                    <label class="flex flex-col gap-1"><span class="kpi-l">Set name</span><input name="name" required class="field" placeholder="Scarlet & Violet 151"></label>
                    <label class="flex flex-col gap-1"><span class="kpi-l">TCGdex set id <span class="normal-case tracking-normal text-dark-400">(optional, for the logo)</span></span><input name="setPath" class="field" placeholder="sv/sv03.5"></label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex flex-col gap-1"><span class="kpi-l">Pages</span><input name="pages" type="number" min="1" max="200" value="20" required class="field"></label>
                        <div class="flex flex-col gap-1"><span class="kpi-l">Pockets per page</span>
                            <nav class="seg" data-pockets>
                                <button type="button" data-value="4">4</button>
                                <button type="button" data-value="9" class="on">9</button>
                                <button type="button" data-value="12">12</button>
                            </nav>
                        </div>
                    </div>
                    <div class="mt-2 flex justify-end gap-2">
                        <button type="button" class="btn btn-muted" data-close>Cancel</button>
                        <button type="submit" class="btn">Add binder</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="modal" data-modal="photo">
            <div class="relative w-full max-w-[980px] overflow-hidden rounded-xl border border-line bg-panel">
                <div class="flex items-center justify-between gap-3 bg-dark-900 px-5 py-3">
                    <div class="min-w-0"><b class="block truncate" data-photo-title></b><span class="sub" data-photo-sub></span></div>
                    <div class="flex shrink-0 items-center gap-1">
                        <button type="button" aria-label="Previous page" class="grid size-8 cursor-pointer place-items-center rounded-md bg-dark-700 text-dark-100 hover:bg-brand hover:text-white" data-photo-prev>‹</button>
                        <button type="button" aria-label="Next page" class="grid size-8 cursor-pointer place-items-center rounded-md bg-dark-700 text-dark-100 hover:bg-brand hover:text-white" data-photo-next>›</button>
                        <button type="button" aria-label="Close" class="ml-2 grid size-8 cursor-pointer place-items-center rounded-md bg-dark-700 text-lg text-dark-100 hover:bg-brand hover:text-white" data-close>×</button>
                    </div>
                </div>
                <div class="grid place-items-center bg-dark-950 p-3"><img alt="" class="max-h-[75vh] w-auto rounded-md" data-photo-img></div>
            </div>
        </div>

        <script type="module">
            const STALE_DAYS = 180;
            const $ = (s, root = document) => root.querySelector(s);
            const $$ = (s, root = document) => [...root.querySelectorAll(s)];

            const db = await new Promise((resolve, reject) => {
                const req = indexedDB.open('binder-vault', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('photos');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            const store = (mode) => db.transaction('photos', mode).objectStore('photos');
            const request = (req) => new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
            const photoKey = (binderId, page) => `${binderId}:${page}`;

            let binders = JSON.parse(localStorage.getItem('binders') ?? 'null') ?? [
                { id: crypto.randomUUID(), name: 'Scarlet & Violet 151', setPath: 'sv/sv03.5', pages: 24, pockets: 9 },
                { id: crypto.randomUUID(), name: 'Evolving Skies', setPath: 'swsh/swsh7', pages: 28, pockets: 9 },
                { id: crypto.randomUUID(), name: 'Base Set', setPath: 'base/base1', pages: 12, pockets: 9 },
            ];
            const saveBinders = () => localStorage.setItem('binders', JSON.stringify(binders));
            saveBinders();

            const photos = new Map();
            const urls = new Map();
            await new Promise((resolve) => {
                const req = store('readonly').openCursor();
                req.onsuccess = () => {
                    const cursor = req.result;
                    if (!cursor) return resolve();
                    photos.set(cursor.key, cursor.value);
                    cursor.continue();
                };
            });

            if (!localStorage.getItem('demoSeeded')) {
                const demo = { id: crypto.randomUUID(), name: 'Paldea Evolved', setPath: 'sv/sv02', pages: 16, pockets: 9 };
                binders.unshift(demo);
                saveBinders();
                const hues = [18, 200, 140, 280, 45, 340, 170, 230, 90];
                const placeholder = (page) => {
                    const cards = Array.from({ length: 9 }, (_, i) => {
                        const x = 40 + (i % 3) * 250;
                        const y = 40 + Math.floor(i / 3) * 330;
                        const hue = hues[(i + page * 2) % hues.length];
                        return `<rect x="${x}" y="${y}" width="220" height="305" rx="12" fill="hsl(${hue} 45% 32%)" stroke="hsl(${hue} 60% 55%)" stroke-width="4"/>`
                            + `<rect x="${x + 18}" y="${y + 40}" width="184" height="120" rx="6" fill="hsl(${hue} 40% 20%)"/>`
                            + `<rect x="${x + 18}" y="${y + 180}" width="140" height="12" rx="6" fill="hsl(${hue} 30% 60%)"/>`
                            + `<rect x="${x + 18}" y="${y + 204}" width="100" height="12" rx="6" fill="hsl(${hue} 30% 50%)"/>`;
                    }).join('');
                    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="790" height="1040" viewBox="0 0 790 1040"><rect width="790" height="1040" fill="#121314"/>${cards}<text x="395" y="1025" fill="#7A8286" font-family="system-ui" font-size="22" text-anchor="middle">Page ${page}</text></svg>`;
                    return new Blob([svg], { type: 'image/svg+xml' });
                };
                const day = 86400000;
                const tx = store('readwrite');
                for (let p = 1; p <= demo.pages; p++) {
                    if ([7, 12, 15, 16].includes(p)) continue;
                    const entry = { blob: placeholder(p), takenAt: Date.now() - ([3, 4].includes(p) ? 240 : p % 5 + 2) * day, name: `page-${p}.svg` };
                    tx.put(entry, photoKey(demo.id, p));
                    photos.set(photoKey(demo.id, p), entry);
                }
                localStorage.setItem('demoSeeded', '1');
            }

            const photoUrl = (key) => {
                if (!urls.has(key)) urls.set(key, URL.createObjectURL(photos.get(key).blob));
                return urls.get(key);
            };

            const state = { binderId: null, filter: 'all', uploadTarget: null, viewing: null };

            const dateFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            const daysAgo = (ts) => Math.floor((Date.now() - ts) / 86400000);
            const relative = (ts) => {
                const d = daysAgo(ts);
                if (d === 0) return 'today';
                if (d === 1) return 'yesterday';
                if (d < 31) return `${d} days ago`;
                if (d < 365) return `${Math.floor(d / 30)} months ago`;
                return `${Math.floor(d / 365)} years ago`;
            };
            const isStale = (photo) => daysAgo(photo.takenAt) > STALE_DAYS;
            const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
            const logoUrl = (b) => b.setPath ? `https://assets.tcgdex.net/en/${b.setPath}/logo.png` : null;
            const logoHtml = (b) => logoUrl(b)
                ? `<img src="${logoUrl(b)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:this.dataset.name}))" data-name="${esc(b.name)}">`
                : `<b>${esc(b.name)}</b>`;

            const binderStats = (b) => {
                const taken = [];
                for (let p = 1; p <= b.pages; p++) {
                    const photo = photos.get(photoKey(b.id, p));
                    if (photo) taken.push(photo);
                }
                const times = taken.map((p) => p.takenAt);
                return {
                    done: taken.length,
                    stale: taken.filter(isStale).length,
                    latest: times.length ? Math.max(...times) : null,
                    oldest: times.length ? Math.min(...times) : null,
                    pct: b.pages ? taken.length / b.pages : 0,
                };
            };

            const setBar = (el, pct) => {
                el.classList.toggle('done', pct >= 1);
                $('span', el).style.width = `${Math.round(pct * 100)}%`;
            };

            function renderOverview() {
                const all = binders.map((b) => ({ b, s: binderStats(b) }));
                const totalPages = all.reduce((n, { b }) => n + b.pages, 0);
                const donePages = all.reduce((n, { s }) => n + s.done, 0);
                const stalePages = all.reduce((n, { s }) => n + s.stale, 0);
                const latest = Math.max(0, ...all.map(({ s }) => s.latest ?? 0));
                const oldestList = all.map(({ s }) => s.oldest).filter(Boolean);
                const oldest = oldestList.length ? Math.min(...oldestList) : null;
                const complete = all.filter(({ s }) => s.pct >= 1).length;
                const pct = totalPages ? donePages / totalPages : 0;

                $('[data-overview-sub]').textContent = `${binders.length} binders · ${donePages} of ${totalPages} pages photographed` + (latest ? ` · last photo ${dateFmt.format(latest)}` : '');
                $('[data-kpi="binders"]').textContent = binders.length;
                $('[data-kpi-s="binders"]').textContent = `${complete} fully photographed`;
                $('[data-kpi="pages"]').textContent = donePages;
                $('[data-kpi-s="pages"]').textContent = `${totalPages - donePages} still missing`;
                $('[data-kpi="coverage"]').textContent = `${Math.round(pct * 100)}%`;
                setBar($('[data-kpi-bar]'), pct);
                $('[data-kpi="oldest"]').textContent = oldest ? relative(oldest) : '—';
                $('[data-kpi-s="oldest"]').textContent = oldest ? dateFmt.format(oldest) : 'No photos yet';

                const notice = $('[data-overview-notice]');
                const parts = [];
                if (totalPages - donePages > 0) parts.push(`${totalPages - donePages} pages have no photo yet`);
                if (stalePages > 0) parts.push(`${stalePages} photos are older than ${STALE_DAYS} days and may not match your binders anymore`);
                notice.classList.toggle('hidden', parts.length === 0);
                notice.textContent = parts.length ? `${parts.join(', and ')}. Keep your photos up to date so your insurance claim reflects your collection.` : '';

                $('[data-binders]').innerHTML = all.length ? all.map(({ b, s }) => `
                    <article class="binder" data-binder="${b.id}">
                        <div class="binder-logo">${logoHtml(b)}</div>
                        <div>
                            <b class="block truncate">${esc(b.name)}${s.pct >= 1 ? '<span class="tag">COMPLETE</span>' : ''}${s.stale ? `<span class="tag tag-muted">${s.stale} outdated</span>` : ''}</b>
                            <span class="sub">${b.pages} pages · ${b.pages * b.pockets} pockets</span>
                        </div>
                        <div class="bar ${s.pct >= 1 ? 'done' : ''}"><span style="width:${Math.round(s.pct * 100)}%"></span></div>
                        <div class="flex items-center justify-between gap-2">
                            <span class="chip">${s.done}/${b.pages} pages</span>
                            <span class="sub">${s.latest ? `Updated ${relative(s.latest)}` : 'No photos yet'}</span>
                        </div>
                    </article>`).join('') : '<div class="panel sm:col-span-2 lg:col-span-3 xl:col-span-4"><div class="empty">No binders yet.</div></div>';
            }

            function renderBinder() {
                const b = binders.find((x) => x.id === state.binderId);
                if (!b) return showOverview();
                const s = binderStats(b);
                $('[data-binder-logo]').innerHTML = logoHtml(b);
                $('[data-binder-title]').textContent = b.name;
                $('[data-binder-sub]').textContent = `${b.pages} pages · ${b.pockets} pockets per page` + (s.latest ? ` · updated ${relative(s.latest)}` : '');
                $('[data-binder-count]').textContent = `${s.done} of ${b.pages} photographed`;
                setBar($('[data-binder-bar]'), s.pct);
                $$('[data-filter] button').forEach((el) => el.classList.toggle('on', el.dataset.filterValue === state.filter));

                const tiles = [];
                for (let p = 1; p <= b.pages; p++) {
                    const key = photoKey(b.id, p);
                    const photo = photos.get(key);
                    if (state.filter === 'missing' && photo) continue;
                    if (state.filter === 'stale' && (!photo || !isStale(photo))) continue;
                    tiles.push(photo ? `
                        <div class="slot">
                            <img src="${photoUrl(key)}" alt="Page ${p}" data-view-page="${p}" loading="lazy">
                            <div class="acts">
                                <button type="button" title="Replace photo" aria-label="Replace photo" data-upload-page="${p}">
                                    <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>
                                </button>
                                <button type="button" title="Delete photo" aria-label="Delete photo" data-delete-page="${p}">
                                    <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                                </button>
                            </div>
                            <div class="lbl"><span>Page ${p}</span><span class="${isStale(photo) ? 'text-brand' : 'font-normal text-dark-200'}">${relative(photo.takenAt)}</span></div>
                        </div>` : `
                        <button type="button" class="slot missing" data-upload-page="${p}">
                            <span class="flex flex-col items-center gap-1.5">
                                <svg class="size-7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
                                <b class="text-[13px]">Page ${p}</b>
                                <span class="text-xs">Add photo</span>
                            </span>
                        </button>`);
                }
                $('[data-pages]').innerHTML = tiles.join('') || `<div class="empty col-span-full">${state.filter === 'missing' ? 'Every page has a photo.' : 'No outdated photos.'}</div>`;
            }

            function showOverview() {
                state.binderId = null;
                history.replaceState(null, '', location.pathname);
                $('[data-view="overview"]').hidden = false;
                $('[data-view="binder"]').hidden = true;
                renderOverview();
            }

            function showBinder(id) {
                state.binderId = id;
                state.filter = 'all';
                history.replaceState(null, '', `#${id}`);
                $('[data-view="overview"]').hidden = true;
                $('[data-view="binder"]').hidden = false;
                renderBinder();
                scrollTo(0, 0);
            }

            const render = () => state.binderId ? renderBinder() : renderOverview();

            async function savePhoto(page, file) {
                const key = photoKey(state.binderId, page);
                const entry = { blob: file, takenAt: file.lastModified || Date.now(), name: file.name };
                await request(store('readwrite').put(entry, key));
                if (urls.has(key)) URL.revokeObjectURL(urls.get(key));
                urls.delete(key);
                photos.set(key, entry);
                render();
            }

            async function deletePhoto(binderId, page) {
                const key = photoKey(binderId, page);
                await request(store('readwrite').delete(key));
                if (urls.has(key)) URL.revokeObjectURL(urls.get(key));
                urls.delete(key);
                photos.delete(key);
            }

            const openModal = (name) => $(`[data-modal="${name}"]`).classList.add('open');
            const closeModals = () => $$('.modal').forEach((m) => m.classList.remove('open'));

            function viewPhoto(page) {
                const b = binders.find((x) => x.id === state.binderId);
                const taken = Array.from({ length: b.pages }, (_, i) => i + 1).filter((p) => photos.has(photoKey(b.id, p)));
                if (!taken.length) return closeModals();
                if (!taken.includes(page)) page = taken[0];
                state.viewing = { page, taken };
                const photo = photos.get(photoKey(b.id, page));
                $('[data-photo-title]').textContent = `${b.name} · Page ${page}`;
                $('[data-photo-sub]').textContent = `Taken ${dateFmt.format(photo.takenAt)} (${relative(photo.takenAt)}) · ${taken.indexOf(page) + 1} of ${taken.length}`;
                $('[data-photo-img]').src = photoUrl(photoKey(b.id, page));
                openModal('photo');
            }
            const stepPhoto = (dir) => {
                if (!state.viewing) return;
                const { page, taken } = state.viewing;
                viewPhoto(taken[(taken.indexOf(page) + dir + taken.length) % taken.length]);
            };

            document.addEventListener('click', async (e) => {
                const t = e.target;
                if (t.closest('[data-home]')) { e.preventDefault(); return showOverview(); }
                if (t.closest('[data-open-add]')) { $('[data-add-form]').reset(); return openModal('add'); }
                if (t.closest('[data-close]') || t.classList.contains('modal')) { state.viewing = null; return closeModals(); }

                const binder = t.closest('[data-binder]');
                if (binder) return showBinder(binder.dataset.binder);

                const filter = t.closest('[data-filter-value]');
                if (filter) { state.filter = filter.dataset.filterValue; return renderBinder(); }

                const pocket = t.closest('[data-pockets] button');
                if (pocket) return $$('[data-pockets] button').forEach((el) => el.classList.toggle('on', el === pocket));

                const upload = t.closest('[data-upload-page]');
                if (upload) { state.uploadTarget = Number(upload.dataset.uploadPage); $('[data-file]').value = ''; return $('[data-file]').click(); }

                const view = t.closest('[data-view-page]');
                if (view) return viewPhoto(Number(view.dataset.viewPage));

                const del = t.closest('[data-delete-page]');
                if (del && confirm(`Delete the photo of page ${del.dataset.deletePage}?`)) { await deletePhoto(state.binderId, Number(del.dataset.deletePage)); return renderBinder(); }

                if (t.closest('[data-photo-prev]')) return stepPhoto(-1);
                if (t.closest('[data-photo-next]')) return stepPhoto(1);

                if (t.closest('[data-add-page]')) {
                    const b = binders.find((x) => x.id === state.binderId);
                    b.pages++;
                    saveBinders();
                    return renderBinder();
                }

                if (t.closest('[data-delete-binder]')) {
                    const b = binders.find((x) => x.id === state.binderId);
                    if (!confirm(`Delete "${b.name}" and all ${binderStats(b).done} of its photos?`)) return;
                    for (let p = 1; p <= b.pages; p++) await deletePhoto(b.id, p);
                    binders = binders.filter((x) => x.id !== b.id);
                    saveBinders();
                    return showOverview();
                }

                if (t.closest('[data-export]')) {
                    for (const b of binders) {
                        for (let p = 1; p <= b.pages; p++) {
                            const key = photoKey(b.id, p);
                            if (!photos.has(key)) continue;
                            const ext = (photos.get(key).name?.split('.').pop() || 'jpg').toLowerCase();
                            Object.assign(document.createElement('a'), { href: photoUrl(key), download: `${b.name} - page ${String(p).padStart(3, '0')}.${ext}` }).click();
                            await new Promise((r) => setTimeout(r, 150));
                        }
                    }
                }
            });

            $('[data-file]').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file && state.uploadTarget) savePhoto(state.uploadTarget, file);
            });

            $('[data-add-form]').addEventListener('submit', (e) => {
                e.preventDefault();
                const form = new FormData(e.target);
                const binder = {
                    id: crypto.randomUUID(),
                    name: form.get('name').trim(),
                    setPath: form.get('setPath').trim().replace(/^\/+|\/+$/g, ''),
                    pages: Number(form.get('pages')),
                    pockets: Number($('[data-pockets] .on').dataset.value),
                };
                binders.push(binder);
                saveBinders();
                closeModals();
                showBinder(binder.id);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { state.viewing = null; closeModals(); }
                if (!$('[data-modal="photo"]').classList.contains('open')) return;
                if (e.key === 'ArrowLeft') stepPhoto(-1);
                if (e.key === 'ArrowRight') stepPhoto(1);
            });

            const initial = location.hash.slice(1);
            binders.some((b) => b.id === initial) ? showBinder(initial) : showOverview();
        </script>
    </body>
</html>
