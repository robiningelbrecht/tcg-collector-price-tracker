services:
    php-cli:
        build:
            context: ./
            dockerfile: docker/php-cli/Dockerfile
        container_name: 'tcg-collector-price-tracker-php-cli'
        volumes:
            - './:/var/www/'
        working_dir: /var/www
        env_file:
            - path: ./.env
              required: true
            - path: ./.env.local
              required: false
        environment:
            - PHP_IDE_CONFIG=phpstorm
            - TZ=Europe/Brussels
        profiles: [on-demand]
        networks:
            - tcg-collector-price-tracker-network
    web:
        build:
            context: ./
            dockerfile: docker/web/Dockerfile
        container_name: 'tcg-collector-price-tracker-web'
        restart: unless-stopped
        volumes:
            - './storage:/var/www/storage'
        env_file:
            - path: ./.env.local
              required: false
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:2019/metrics"]
            start_period: 30s
        environment:
            - TZ=Europe/Brussels
        ports:
            - '8082:8080'
        networks:
            - tcg-collector-price-tracker-network

networks:
    tcg-collector-price-tracker-network: {}
